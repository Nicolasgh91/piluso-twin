<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piluso · Tu copiloto en cada viaje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F1E7;--paper:#FCFAF5;--sand:#EDE5D3;--sand-2:#E2D8C2;--line:#DDD3BE;--ink:#26241F;--muted:#6A6558;
  --forest:#1F3A2B;--forest-c:#2C5A40;--olive:#7C8450;--bronze:#A8622F;--bronze-bg:#F1E0CE;
  --primary:#1F3A2B;--primary-ink:#F6F1E7;--primary-h:#2C4D3B;
  --side:#1F3A2B;--side-ink:#EDE8D6;--side-mut:#A9B8A6;--side-act:#34553F;
  --ok:#2F6B45;--ok-bg:#DCEBDD;--warn:#86570F;--warn-bg:#F5E6C4;--bad:#9B3A2B;--bad-bg:#F3D9D2;--info:#3B5B6B;--info-bg:#DDE8EC;
  --bub-out:#DCE7D0;--wa-out:#D6EFBE;--wa-bg:#EAE3D2;--wa:#1F8A4C;--scrim:rgba(18,28,22,.5);--shadow:0 12px 36px -14px rgba(31,58,43,.35);
  --font-d:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;--font-b:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1914;--paper:#17251D;--sand:#203227;--sand-2:#2A4033;--line:#2D4639;--ink:#EDE8DA;--muted:#A5AFA0;
  --forest:#CBD8AE;--forest-c:#9CB77E;--olive:#A9B27A;--bronze:#E0A06B;--bronze-bg:#3B2A1D;
  --primary:#CBD8AE;--primary-ink:#14201A;--primary-h:#DCE6C3;--side:#0A120E;--side-ink:#E8E2D0;--side-mut:#8FA08C;--side-act:#1F362A;
  --ok:#8FD5A6;--ok-bg:#16402B;--warn:#F2C96B;--warn-bg:#3C3211;--bad:#FFA396;--bad-bg:#47221D;--info:#9FC3D4;--info-bg:#1B3541;
  --bub-out:#243D2D;--wa-out:#1F4A2C;--wa-bg:#14221A;--scrim:rgba(0,0,0,.62);--shadow:0 12px 36px -14px rgba(0,0,0,.7);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1914;--paper:#17251D;--sand:#203227;--sand-2:#2A4033;--line:#2D4639;--ink:#EDE8DA;--muted:#A5AFA0;
  --forest:#CBD8AE;--forest-c:#9CB77E;--olive:#A9B27A;--bronze:#E0A06B;--bronze-bg:#3B2A1D;
  --primary:#CBD8AE;--primary-ink:#14201A;--primary-h:#DCE6C3;--side:#0A120E;--side-ink:#E8E2D0;--side-mut:#8FA08C;--side-act:#1F362A;
  --ok:#8FD5A6;--ok-bg:#16402B;--warn:#F2C96B;--warn-bg:#3C3211;--bad:#FFA396;--bad-bg:#47221D;--info:#9FC3D4;--info-bg:#1B3541;
  --bub-out:#243D2D;--wa-out:#1F4A2C;--wa-bg:#14221A;--scrim:rgba(0,0,0,.62);--shadow:0 12px 36px -14px rgba(0,0,0,.7);color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font-b);-webkit-font-smoothing:antialiased}
#app{height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--bronze);outline-offset:2px}
h1,h2,h3{font-family:var(--font-d);font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.15}
h1{font-size:2rem}h2{font-size:1.2rem}h3{font-size:1.05rem}
p{margin:0}
.ic{flex:none}
.muted{color:var(--muted)}.fine{font-size:.8125rem;color:var(--muted)}.lead{color:var(--muted);max-width:68ch;margin-top:.35rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.grow{flex:1;min-width:0}.rel{position:relative}
.pad-t{padding-top:.75rem}.pad-b{padding-bottom:.9rem}.pad{padding:1rem}
.err{color:var(--bad);font-weight:600;font-size:.8125rem;margin-top:.25rem}
.hint{font-size:.78rem;color:var(--muted);margin-top:.25rem}
.count{display:inline-block;min-width:1.35rem;padding:0 .35rem;border-radius:999px;background:var(--sand-2);font-size:.75rem;line-height:1.35rem;text-align:center;font-weight:600}
.badge{display:inline-block;min-width:1.35rem;height:1.35rem;padding:0 .4rem;border-radius:999px;background:var(--bronze);color:#fff;font-size:.72rem;font-weight:700;line-height:1.35rem;text-align:center}
.dot-n{position:absolute;top:-5px;right:-5px;min-width:1.15rem;height:1.15rem;padding:0 .3rem;border-radius:999px;background:var(--bronze);color:#fff;font-size:.68rem;font-weight:700;line-height:1.15rem;text-align:center}
.meta .dot-n{position:static}
/* brand */
.brand{display:inline-flex;align-items:center;gap:.5rem}.mark{width:34px;height:auto}.mark.xl{width:60px}
.wm{font-family:var(--font-d);font-weight:500;font-size:1.65rem;letter-spacing:-.03em;line-height:1}.wm.xl{font-size:3.1rem;display:block}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid transparent;border-radius:8px;padding:.6rem 1rem;font-weight:600;font-size:.9rem;line-height:1.15;background:var(--sand);color:var(--ink);text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--primary);color:var(--primary-ink)}.btn.primary:hover:not(:disabled){background:var(--primary-h)}
.btn.ghost{background:transparent;border-color:var(--line)}.btn.ghost:hover:not(:disabled){background:var(--sand)}
.btn.danger{background:var(--bad);color:#fff}.btn.danger-o{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:.4rem .7rem;font-size:.8125rem;border-radius:7px}.btn.lg{padding:.8rem 1.25rem;font-size:1rem}.btn.xl{padding:1rem 1.6rem;font-size:1.05rem;border-radius:10px}.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.5}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);background:transparent;border-radius:8px}.icon-btn.sm{width:32px;height:32px}.icon-btn:hover:not(:disabled){background:var(--sand)}.icon-btn:disabled{opacity:.4}
.linkish{border:0;background:none;padding:0;font-weight:600;text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
.back{display:inline-flex;align-items:center;gap:.3rem;margin-bottom:.9rem}
.pill{display:inline-block;padding:.18rem .6rem;border-radius:999px;font-size:.75rem;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.neutral{background:var(--sand);color:var(--muted)}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;flex:none}.av.pili-av{width:30px;height:30px;background:var(--forest);color:var(--primary-ink)}
.pm{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--bronze);color:#fff;flex:none}.pm.lg{width:42px;height:42px}
.chan{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;flex:none}.chan.wa{background:var(--ok-bg);color:var(--wa)}.chan.web{background:var(--info-bg);color:var(--info)}
/* shell */
.app{display:grid;grid-template-columns:216px minmax(0,1fr);height:100%}
.app.pili-open{grid-template-columns:216px minmax(0,1fr) 380px}
.side{display:flex;flex-direction:column;gap:.25rem;padding:1.1rem .8rem;background:var(--side);color:var(--side-ink);overflow-y:auto}
.side-brand{padding:.2rem .5rem 1.2rem}.side-brand .wm{color:var(--side-ink)}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-item{display:flex;align-items:center;gap:.7rem;width:100%;border:0;background:transparent;color:var(--side-mut);text-align:left;padding:.62rem .75rem;border-radius:8px;font-size:.92rem;font-weight:500}
.side-item span:not(.badge){flex:1}.side-item:hover{background:var(--side-act);color:var(--side-ink)}
.side-item[aria-current="page"]{background:var(--side-act);color:var(--side-ink);font-weight:600}
.side-pili{margin-top:auto;display:flex;align-items:center;gap:.7rem;border:1px solid rgba(237,232,214,.18);background:transparent;color:var(--side-ink);text-align:left;padding:.7rem;border-radius:10px}
.side-pili:hover,.side-pili[aria-expanded="true"]{background:var(--side-act)}.side-pili span:last-child{display:grid}.side-pili small{color:var(--side-mut);font-size:.75rem}
.work{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}
.top{display:flex;align-items:center;justify-content:flex-end;gap:.75rem;padding:.7rem 1.5rem;border-bottom:1px solid var(--line);background:var(--bg)}
.menu-btn,.top-brand{display:none}.top-right{display:flex;align-items:center;gap:.6rem;margin-left:auto}
.agency-btn{display:inline-flex;align-items:center;gap:.4rem;border:0;background:transparent;font-weight:600;padding:.4rem .5rem;border-radius:8px}.agency-btn:hover{background:var(--sand)}
.avatar-btn{border:0;background:transparent;padding:0;border-radius:50%}
.page{overflow-y:auto;padding:1.6rem 2rem 3rem;min-width:0}.page:focus{outline:none}.page.full{padding:0;overflow:hidden}
.pop{position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:230px;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:.35rem;display:grid}
.pop.pop-up{top:auto;bottom:calc(100% + 6px)}
.pop button{display:flex;align-items:center;gap:.6rem;border:0;background:transparent;text-align:left;padding:.55rem .65rem;border-radius:7px;font-size:.88rem}.pop button:hover{background:var(--sand)}.pop button span{display:grid}.pop small{font-size:.75rem;color:var(--muted)}
.pop hr{border:0;border-top:1px solid var(--line);margin:.3rem 0}.pop-label{font-size:.75rem;color:var(--muted);padding:.4rem .65rem}
.pop-bell{width:min(380px,calc(100vw - 2rem));padding:.6rem}
.pop-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding-bottom:.5rem}
.notif-list{list-style:none;margin:0;padding:0;max-height:55vh;overflow:auto;display:grid;gap:.25rem}
.notif{display:flex;gap:.6rem;width:100%;text-align:left;border:1px solid transparent;background:transparent;padding:.6rem;border-radius:8px;font-size:.86rem}.notif:hover{background:var(--sand)}
.notif.unread{background:var(--sand);box-shadow:inset 3px 0 0 var(--bronze)}.notif time{margin-left:auto;font-size:.72rem;color:var(--muted);white-space:nowrap}
.wa-phone{border-radius:10px;overflow:hidden;border:1px solid var(--line)}.wa-bar{display:flex;align-items:center;gap:.4rem;background:var(--wa);color:#fff;padding:.5rem .7rem;font-size:.85rem}.wa-bar small{opacity:.85;margin-left:auto;color:#fff}
.wa-feed{display:grid;gap:.4rem;padding:.6rem;background:var(--wa-bg);max-height:50vh;overflow:auto}
.wa-msg{display:grid;gap:.15rem;border:0;text-align:left;background:var(--wa-out);padding:.5rem .65rem;border-radius:10px 10px 10px 2px;font-size:.85rem;max-width:92%}.wa-msg time{font-size:.68rem;color:var(--muted);justify-self:end}
.tabs{display:flex;gap:.25rem;background:var(--sand);border-radius:9px;padding:3px;flex-wrap:wrap;width:fit-content}
.tabs button{border:0;background:transparent;padding:.45rem .85rem;border-radius:7px;font-weight:600;font-size:.86rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 0 var(--line)}.tabs.sm button{padding:.3rem .6rem;font-size:.8rem}
/* page parts */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.1rem}.head-actions{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.toolbar{display:flex;gap:.8rem;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:1rem}.selects{display:flex;gap:.5rem;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:.5rem;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:0 .7rem;min-width:min(300px,100%);color:var(--muted)}
.search input{border:0;background:transparent;padding:.55rem 0;width:100%;outline:none;color:var(--ink)}.search:focus-within{border-color:var(--forest-c);outline:2px solid var(--bronze)}
select,.field input,.field textarea,.cost-row input,.composer input,.pili-in input,.add-row input,.money-in input{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:.55rem .7rem;min-width:0;color:var(--ink)}
select{padding-right:1.6rem}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:1.1rem 1.2rem}.card-h{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.8rem}
.stack{display:grid;gap:1rem;align-content:start;min-width:0}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;margin-top:1rem}
.grid-main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1rem;align-items:start}.grid-main.rep{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);margin:1rem 0}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:.15rem}
.row{display:flex;align-items:center;gap:.75rem;width:100%;border:0;background:transparent;text-align:left;padding:.6rem .5rem;border-radius:8px}.row:hover:not(.static){background:var(--sand)}.row.static{cursor:default}
.row b{display:block;font-weight:600;font-size:.9rem}.row small{display:block;font-size:.78rem;color:var(--muted)}
.dayb{display:grid;place-items:center;width:46px;height:46px;border-radius:8px;background:var(--sand);line-height:1;flex:none}.dayb b{font-family:var(--font-d);font-size:1.15rem}.dayb small{font-size:.68rem;color:var(--muted)}
.ico-c{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--sand);flex:none;color:var(--forest-c)}.ico-c.warn{background:var(--warn-bg);color:var(--warn)}
.empty{padding:2rem;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.empty .btn{margin-top:.8rem}
.banner{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:.9rem 1.1rem;border-radius:10px;margin-bottom:1rem;background:var(--sand)}.banner p{font-size:.88rem;margin-top:.2rem}
.banner.bad{background:var(--bad-bg);color:var(--ink)}.banner.warn{background:var(--warn-bg)}.banner.info{background:var(--info-bg)}.banner.slim{padding:.55rem .9rem;font-size:.88rem;margin:.6rem 0}
.row-btns{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}.row-btns.center{justify-content:center}
/* tables */
.table-wrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px}.table-wrap.flat{border:0;background:transparent}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:.7rem .85rem;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-weight:600;font-size:.8rem;color:var(--muted);background:var(--sand)}tbody tr:last-child td{border-bottom:0}
td small{display:block;font-size:.76rem;color:var(--muted)}td b{font-weight:600}
.num{text-align:right;font-variant-numeric:tabular-nums}.neg{color:var(--bad)}.pos{color:var(--ok)}
.th-btn{border:0;background:none;font-weight:600;color:inherit;padding:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sand)}
tr.edited td:first-child{box-shadow:inset 3px 0 0 var(--bronze)}tr.hl td{background:var(--warn-bg)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:.8rem;flex-wrap:wrap}
.cell-av{display:inline-flex;align-items:center;gap:.6rem}.cell-av span{display:grid}
input.cell{width:100%;min-width:9rem;border:1px solid transparent;background:transparent;border-radius:6px;padding:.35rem .5rem}input.cell:hover{border-color:var(--line)}input.cell:focus{outline:none;border-color:var(--forest-c);background:var(--bg)}input.cell.money{min-width:7rem;text-align:right;font-variant-numeric:tabular-nums}input.cell.invalid{border-color:var(--bad);background:var(--bad-bg)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.45rem 1.1rem;font-size:.9rem;margin:0}.kv dt{color:var(--muted);display:flex;align-items:center;gap:.4rem}.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}.kv.tight{gap:.35rem .8rem}
.kv.roles{grid-template-columns:7rem 1fr}
.kv select{font-weight:600}
.econ{display:grid;grid-template-columns:1fr auto;gap:.35rem 1rem;font-size:.9rem;margin-top:1rem;padding-top:.8rem;border-top:1px solid var(--line)}.econ b{text-align:right;font-variant-numeric:tabular-nums}.econ .tot{font-weight:700;border-top:1px solid var(--line);padding-top:.4rem}
.notes{list-style:none;margin:.8rem 0 0;padding:0;display:grid;gap:.6rem}.notes li{background:var(--sand);border-radius:8px;padding:.6rem .8rem}.notes small{color:var(--muted)}
.mini-pk{display:flex;gap:.9rem;align-items:center;margin-bottom:.9rem}.mini-pk .thumb{width:110px;flex:none}
.itin{margin:0;padding:0;list-style:none;display:grid;gap:.5rem;counter-reset:d}
.itin li{counter-increment:d;display:grid;grid-template-columns:3.4rem 1fr;gap:.5rem;font-size:.9rem}.itin li::before{content:"Día " counter(d);font-weight:600;color:var(--muted)}
.mini-pk+.itin li,.card>.itin li{grid-template-columns:3.4rem 1fr}
.tpkg .itin li{display:block}.tpkg .itin li::before{content:none}.tpkg .itin li{display:grid;grid-template-columns:4.2rem 1fr;gap:.5rem}
/* dashboard */
.hero{position:relative;height:215px;border-radius:14px;overflow:hidden;background:var(--sand)}
.hero .art,.t-hero .art,.land-art .art{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,32,24,.62),rgba(20,32,24,.1) 62%)}
.hero-txt{position:absolute;left:2rem;bottom:3.4rem;color:#fff}.hero-txt h1{font-size:2.3rem;color:#fff}.hero-txt p{opacity:.92;margin-top:.2rem}
.hero-filter{position:absolute;right:1rem;top:1rem}.hero-filter select{background:rgba(252,250,245,.92);color:#26241F;border-color:transparent}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.9rem;padding:0 1.2rem;margin-top:-2.6rem;position:relative}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:.9rem 1.1rem;box-shadow:0 8px 24px -16px rgba(31,58,43,.4)}
.kpi-h{display:flex;align-items:center;gap:.5rem;font-size:.82rem;color:var(--muted)}.kpi-ic{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--sand);color:var(--forest-c)}
.kpi-v{font:600 1.85rem/1.15 var(--font-d);margin-top:.5rem;letter-spacing:-.02em}.kpi-s{display:flex;gap:.5rem;font-size:.78rem;color:var(--muted);flex-wrap:wrap;margin-top:.2rem}
.kpi-d{font-weight:700}.kpi-d.up{color:var(--ok)}.kpi-d.down{color:var(--bad)}
.note-fx{margin:.8rem 0 0}
/* packages */
.pk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1.1rem}
.pk-card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column}
.thumb{position:relative;aspect-ratio:16/9;border-radius:11px 11px 0 0;overflow:hidden;background:var(--sand)}.thumb .art{position:absolute;inset:0;width:100%;height:100%;display:block}
.thumb.sm{width:92px;aspect-ratio:4/3;border-radius:8px;flex:none}
.pk-status{position:absolute;top:.7rem;left:.7rem}.pk-body{padding:1rem 1.1rem 1.1rem;display:grid;gap:.7rem}.pk-body h3{font-size:1.25rem}
.pk-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:0}.pk-meta dt{font-size:.74rem;color:var(--muted)}.pk-meta dd{margin:0;font-weight:600;font-size:.9rem}
.pk-actions{display:flex;justify-content:space-between;align-items:center}
/* editor */
.ed-head{display:flex;align-items:center;gap:.9rem;margin-bottom:1.1rem}.ed-head h1{flex:1;font-size:1.7rem}
.ed{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:1.4rem}
.ed-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2rem}.ed-col{display:grid;gap:1.1rem;align-content:start}.ed-wide{display:grid;gap:1.3rem;margin-top:1.3rem;padding-top:1.3rem;border-top:1px solid var(--line)}

  get_fx_quote: ({ from, to }) => ({ pair: from + '/' + to, rate: from === 'USD' ? FX_DEMO_USD_ARS : 1 / FX_DEMO_USD_ARS, source: 'demo' }),

  get_payment_status: ({ payment_id, amount, currency, reference, booking_id, payer, simulate_outcome }) => {

  const bal = { ARS: S.balances.ARS, USD: S.balances.USD }, conversions = []; let ok = true;
  ['ARS', 'USD'].forEach(cur => {
    const other = cur === 'ARS' ? 'USD' : 'ARS', short = need[cur] - bal[cur];

}

      const p2 = S.payouts.find(x => x.id === p0.id); if (p2) { p2.status = 'pagado'; p2.paidAt = nowIso(); p2.transferId = res.transfer_id; }

  } catch (e) { toast('Belo frenó un pago: ' + (e.message === 'insufficient_funds' ? 'saldo insuficiente.' : 'error inesperado.') + ' Los pagos enviados quedaron registrados.', 'bad'); }

/* ===== Pili · traveler-facing parser (deterministic) ===== */
function destinations() {
  const map = new Map();
  S.packages.filter(p => p.status === 'publicado').forEach(p => {
    const d = map.get(p.destination) || { name: p.destination, aliases: new Set([norm(p.destination)]) };
    (p.aliases || []).forEach(a => d.aliases.add(norm(a))); map.set(p.destination, d);
  });

}
const destChips = () => destinations().map(d => ({ label: d.name, text: 'Quiero viajar a ' + d.name }));
function localParse(text) {

  if (/(agente|humano|persona real|hablar con alguien|asesor|mariana|santiago)/.test(t)) r.intent = 'agente';
  else if (/(personaliz|modific|cambiar|sumar una noche|agregar una noche|a medida|extender|una noche mas)/.test(t)) r.intent = 'personalizar';
  else if (/^(hola|buenas|buen dia|hey|que tal)\b/.test(t) && t.length < 22) r.intent = 'saludo';
  for (const d of destinations()) { if ([...d.aliases].some(a => a && t.includes(a))) { r.destination = d.name; break; } }
  MONTHS.forEach((m, i) => { if (new RegExp('\\b' + m + '\\b').test(t)) r.month = i + 1; });
  const dm = t.match(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?\b/);

  if (!r.month && /fin de ano|fiestas/.test(t)) r.month = 12;

  publishedPkgs().filter(p => p.destination === dest).sort((a, b) => a.dateFrom.localeCompare(b.dateFrom)).forEach(p => { const [y, m] = parts(p.dateFrom); const label = cap(MONTHS[m - 1]) + ' ' + y; seen.set(label, { label, text: 'En ' + MONTHS[m - 1] + ' de ' + y }); });

}

function piliFree(text) {

  let key = null, arg = null;
  if (/resum/.test(t)) key = x.type === 'booking' ? 'bsumm' : x.type === 'customer' ? 'csumm' : /reserva/.test(t) ? 'bsum' : 'summ';
  else if (/(respuesta|redact|borrador|escrib)/.test(t)) key = 'draft';
  else if (/(cotiz|presupuesto)/.test(t)) key = 'quote';
  else if (/(pendiente|sin responder)/.test(t)) key = 'pending';
  else if (/(siguiente|proxim|que hago)/.test(t)) key = 'next';
  else if (/(saldo|pago|cobro|proveedor)/.test(t)) key = x.type === 'booking' ? 'bpay' : 'ppay';
  else if (/reserva/.test(t)) key = x.type === 'booking' ? 'bsumm' : 'bsum';
  else if (/(cliente|buscar)/.test(t) || known) { key = 'find'; arg = known ? known.name : t.replace(/(buscar|cliente|clientes|a|de|el|la)\b/g, '').trim(); }
  else if (/(paquete|suger|viaje|viajar|destino)/.test(t) || localParse(text).destination || localParse(text).month) { key = 'suggest'; arg = text; }
  if (!key) return piliAsk(text, 'help');

}

/* ===== conversations ===== */
function convBubble(m, view, cust, ch) {
  if (m.from === 'system') return `<p class="sys">${esc(m.text)}</p>`;
  const customerSide = m.from === 'user', out = view === 'agent' ? !customerSide : customerSide;
  const who = m.from === 'pili' ? 'Pili' : m.from === 'agent' ? (view === 'agent' ? 'Agente' : 'Agente de ' + S.agency.name) : cust.name;
  const av = m.from === 'pili' ? `<span class="av pili-av" aria-hidden="true">${piliMark(16)}</span>` : m.from === 'agent' ? avatar('Agente', 30) : avatar(cust.name, 30);
  const tick = ch === 'whatsapp' && out ? ' ✓✓' : '';
  let html = `<div class="msg ${out ? 'out' : 'in'} ${m.from}">${out ? '' : av}<div class="bubble"><span class="who">${esc(who)}</span><p>${esc(m.text)}</p><time>${fmtT(m.at)}${tick}</time></div>${out ? av : ''}</div>`;
  if (m.cards && m.cards.length) html += `<div class="chat-cards ${out ? 'out' : 'in'}">${m.cards.map(pkgById).filter(Boolean).map(p => chatCard(p, view)).join('')}</div>`;
  return html;
}
function chatCard(p, view) {
  const act = view === 'agent' ? 'preview-pkg' : 'open-tpkg';
  return `<article class="chat-card">${thumb(p)}<div class="cc-body"><b>${esc(p.title)}</b><small>${esc(p.destination)} · ${fmtShort(p.dateFrom, p.dateTo)}</small><span class="cc-price">Desde ${money(priceFrom(p), p.currency)}</span><button class="btn sm ${view === 'agent' ? 'ghost' : 'primary'}" data-act="${act}" data-v="${p.id}">Ver paquete</button></div></article>`;
}

/* ===== reports ===== */
function reportsView() {
  const r = ui.rep.range, days = r === 'all' ? 3650 : Number(r), from = daysFromNow(-days), bks = S.bookings.filter(b => isActiveBk(b) || b.pay === 'reembolsado');
  const created = bks.filter(b => b.createdAt.slice(0, 10) >= from && b.pay !== 'sin_cobro'), paid = S.bookings.filter(b => b.pay === 'aprobado' && b.paidAt.slice(0, 10) >= from);
  const rev = sumBy(paid, b => usd(b.total, b.currency)), mar = sumBy(paid, b => usd(economics(b).margin, b.currency));
  const conv = created.length ? Math.round(created.filter(b => b.pay === 'aprobado').length / created.length * 100) : 0;
  const out = sumBy(S.bookings.filter(b => isActiveBk(b) && (b.pay === 'pendiente' || b.pay === 'rechazado')), b => usd(b.total, b.currency));
  const sup = sumBy(S.payouts.filter(p => p.status === 'pagado' && (p.paidAt || '').slice(0, 10) >= from), p => usd(Number(p.amount) || 0, p.currency));
  const weekly = days <= 90, buckets = [];
  if (weekly) { const n = Math.ceil(days / 7); for (let i = n - 1; i >= 0; i--) { const e = daysFromNow(-i * 7), s = addDays(e, -6); buckets.push({ s, e, l: fmtD(s), v: 0 }); } }
  else { const d = new Date(); const n = r === 'all' ? 12 : Math.ceil(days / 30); for (let i = n - 1; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); const s = ymd(x), e = ymd(new Date(x.getFullYear(), x.getMonth() + 1, 0)); buckets.push({ s, e, l: cap(MONTHS_S[x.getMonth()]), v: 0 }); } }
  paid.forEach(b => { const dd = b.paidAt.slice(0, 10), bu = buckets.find(x => dd >= x.s && dd <= x.e); if (bu) bu.v += usd(b.total, b.currency); });
  const ch = created.filter(b => b.channel === 'web').length, cw = created.length - ch, tot = created.length || 1;
  const byPk = {}; paid.forEach(b => { const k = bkPkgTitle(b); byPk[k] = byPk[k] || { n: 0, rev: 0, mar: 0 }; byPk[k].n++; byPk[k].rev += usd(b.total, b.currency); byPk[k].mar += usd(economics(b).margin, b.currency); });
  const rows = Object.entries(byPk).sort((a, b) => b[1].rev - a[1].rev), maxRev = Math.max(1, ...rows.map(x => x[1].rev));
  const metric = (l, v, s) => `<div class="card metric"><span>${l}</span><b>${v}</b><small>${s}</small></div>`;
  return pageHead('Reportes', 'Medí tu crecimiento. Cifras de demostración: no son resultados financieros reales.', `<label class="ctl"><span class="sr">Período</span><select data-bind="rep.range" aria-label="Período">${[['30', 'Últimos 30 días'], ['90', 'Últimos 90 días'], ['180', 'Últimos 6 meses'], ['all', 'Último año']].map(([v, l]) => `<option value="${v}"${r === v ? ' selected' : ''}>${l}</option>`).join('')}</select></label>`)
    + `<div class="metrics">${metric('Ingresos cobrados', money(round(rev, 'USD'), 'USD'), 'USD equivalente')}${metric('Reservas', created.length, paid.length + ' cobradas')}${metric('Conversión de pagos', conv + '%', 'reservas cobradas sobre confirmadas')}${metric('Pagos pendientes de cobro', money(round(out, 'USD'), 'USD'), 'USD equivalente')}${metric('Margen de la agencia', money(round(mar, 'USD'), 'USD'), 'después de comisión y costos')}${metric('Pagos a proveedores', money(round(sup, 'USD'), 'USD'), 'enviados en el período')}</div>`
    + `<div class="grid-main rep"><section class="card"><div class="card-h"><h2>Evolución de ingresos</h2></div>${lineChart(buckets)}</section><section class="card"><div class="card-h"><h2>Por origen</h2></div>${donut(ch, cw, tot)}</section></div>`
    + `<section class="card"><div class="card-h"><h2>Por paquete</h2></div>${rows.length ? `<div class="table-wrap flat"><table><thead><tr><th>Paquete</th><th class="num">Reservas cobradas</th><th class="num">Ingresos (USD eq.)</th><th class="num">Margen (USD eq.)</th><th>Participación</th></tr></thead><tbody>${rows.map(([k, v]) => `<tr><td><b>${esc(k)}</b></td><td class="num">${v.n}</td><td class="num">${money(round(v.rev, 'USD'), 'USD')}</td><td class="num">${money(round(v.mar, 'USD'), 'USD')}</td><td><span class="bar"><i style="width:${Math.round(v.rev / maxRev * 100)}%"></i></span></td></tr>`).join('')}</tbody></table></div>` : empty('Sin cobros en este período.')}</section>`;
}
function lineChart(bu) {
  const W = 560, H = 210, L = 46, R = 12, T = 14, B = 28, max = Math.max(1, ...bu.map(x => x.v)), nice = Math.pow(10, Math.floor(Math.log10(max))), top = Math.ceil(max / nice) * nice;
  const X = i => L + (bu.length < 2 ? (W - L - R) / 2 : i * (W - L - R) / (bu.length - 1)), Y = v => T + (H - T - B) * (1 - v / top);
  const pts = bu.map((b, i) => [X(i), Y(b.v)]), path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const grid = [0, 0.5, 1].map(f => { const y = Y(top * f); return `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" class="gl"/><text x="${L - 8}" y="${y + 4}" text-anchor="end" class="gt">${Math.round(top * f / 1000 * 10) / 10}k</text>`; }).join('');
  const every = Math.ceil(bu.length / 7);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos por período en USD equivalente">${grid}<path d="${path} L${pts[pts.length - 1][0]} ${Y(0)} L${pts[0][0]} ${Y(0)}Z" class="area"/><path d="${path}" class="ln"/>${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" class="pt"><title>${esc(bu[i].l)}: ${money(round(bu[i].v, 'USD'), 'USD')}</title></circle>`).join('')}${bu.map((b, i) => i % every === 0 ? `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" class="gt">${esc(b.l)}</text>` : '').join('')}</svg>`;
}
function donut(web, wa, tot) {
  const C = 2 * Math.PI * 40, a = web / tot * C, pw = Math.round(web / tot * 100), pa = 100 - pw;
  return `<div class="donut"><svg viewBox="0 0 100 100" role="img" aria-label="Reservas por origen: web ${pw}%, WhatsApp ${pa}%"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--bronze)" stroke-width="16"/><circle cx="50" cy="50" r="40" fill="none" stroke="var(--forest-c)" stroke-width="16" stroke-dasharray="${a} ${C - a}" transform="rotate(-90 50 50)"/></svg><ul><li><i style="background:var(--forest-c)"></i> Web <b>${pw}%</b></li><li><i style="background:var(--bronze)"></i> WhatsApp <b>${tot ? pa : 0}%</b></li></ul></div>`;
}

  const form = e.target, kind = form.dataset.form; if (!kind) return; e.preventDefault();
  const val = n => { const el = form.elements[n]; return el ? el.value.trim() : ''; };
  if (kind === 'chat') { const i = document.getElementById('chat-input'), t = i.value.trim(); if (!t) return; i.value = ''; sendTraveler(t); }
  else if (kind === 'agent-msg') { const i = document.getElementById('agent-input'), t = i.value.trim(); if (!t) return; i.value = ''; sendAgent(ui.conv, t); const n = document.getElementById('agent-input'); if (n) n.focus(); }
  else if (kind === 'pili') { const i = document.getElementById('pili-input'), t = i.value.trim(); if (!t) return; i.value = ''; piliFree(t); }
  else if (kind === 'pkg') savePackageEditor();
  else if (kind === 'provider') saveProvider(form);
  else if (kind === 'customer') saveCustomer(form);
  else if (kind === 'note') { const t = val('text'); showFormErrors(form, t ? {} : { text: 'Escribí algo antes de guardar.' }); if (t) addNote(ui.bookingId, t); }
  else if (kind === 'cust-notes') { custById(form.dataset.v).notes = val('notes'); save(); render(); toast('Guardaste las notas.'); }
  else if (kind === 'agency') {
    const errs = {}; if (!val('name')) errs.name = 'Completá el nombre.'; if (!isEmail(val('email'))) errs.email = 'Ingresá un email válido.'; if (!val('phone')) errs.phone = 'Completá el teléfono.';
    showFormErrors(form, errs); if (Object.keys(errs).length) return;
    ['name', 'email', 'phone', 'city', 'web'].forEach(k => { S.agency[k] = val(k); }); save(); render(); toast('Guardaste los datos de la agencia.');
  }
  else if (kind === 'invite') {
    const errs = {}; if (!val('name')) errs.name = 'Completá el nombre.'; if (!isEmail(val('email'))) errs.email = 'Ingresá un email válido.'; if (S.team.some(u => u.email === val('email'))) errs.email = 'Ese email ya está en el equipo.';
    showFormErrors(form, errs); if (Object.keys(errs).length) return;
    S.team.push({ id: uid('u'), name: val('name'), email: val('email'), role: 'Agente', active: true }); ui.modal = null; save(); render(); toast('Invitaste a ' + val('name') + ' como agente.');
  }
  else if (kind === 'changes') { const t = val('text'); showFormErrors(form, t.length >= 5 ? {} : { text: 'Contanos qué querés cambiar (mínimo 5 caracteres).' }); if (t.length >= 5) requestChanges(form.dataset.v, t); }
});

/* ===== routing & sync ===== */
window.addEventListener('hashchange', () => { const r = roleFromHash(); if (r !== ui.role) { ui.role = r; ui.scrollBottom = true; ui.resetScroll = true; render(); } });
window.addEventListener('storage', e => {
  if (e.key !== STORE_KEY) return; const d = load(); if (!d) return; S = d;
  const fresh = S.notifications.filter(n => !ui.seen.has(n.id)); fresh.forEach(n => ui.seen.add(n.id));
  if (ui.role === 'agente') fresh.slice(0, 3).forEach(n => { if (n.wa) waToast(n); else if (n.app) toast(n.text); });
  ui.scrollBottom = true; render();
});
render();
})();
</script>
